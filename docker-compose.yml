# The same container ./start.sh launches, for people who prefer Docker Compose.
# ./start.sh does not use this file; use one or the other, not both at once
# (they share the container name, so a second start fails rather than
# doubling up on the cards).
#
# Before the first start, from the root of this repository:
#   ./install.sh && ./download.sh     # the image and the checkpoint
#   mkdir -p cache                    # kernel compile caches, owned by you
# Then:
#   HOST_UID=$(id -u) HOST_GID=$(id -g) docker compose up -d
#   docker compose logs -f            # wait for "Application startup complete"
#   docker compose down               # stop (allows 120 s for a clean shutdown)
#
# CUDA_VISIBLE_DEVICES (the two cards), IMAGE and MODELS_DIR are read from the
# shell or from .env; every other setting goes in docker/container.env. The API
# is published on 127.0.0.1:8000 only and has no API key.
services:
  qwen38-flash-next:
    image: ${IMAGE:-ghcr.io/morrowmake/vllm-cmp170hx@sha256:{{IMAGE_DIGEST}}}
    container_name: qwen38-flash-next
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /cache
    entrypoint: ["/bin/bash", "/recipe/serve.sh"]
    command: ["mtp"]
    shm_size: 16g
    stop_grace_period: 120s
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - docker/container.env
    environment:
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0,1}
      RECIPE_CACHE_ROOT: /cache
      TMPDIR: /cache/tmp
    volumes:
      - ./serve.sh:/recipe/serve.sh:ro
      - ./boot_check.py:/recipe/boot_check.py:ro
      - ./p2p_check.py:/recipe/p2p_check.py:ro
      - ./p2p_check.sh:/recipe/p2p_check.sh:ro
      - ./p2p_probe.cu:/recipe/p2p_probe.cu:ro
      - ${MODELS_DIR:-./models}/Qwen3.8-Flash-Next-exl3:/models/Qwen3.8-Flash-Next-exl3:ro
      - ./cache:/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
